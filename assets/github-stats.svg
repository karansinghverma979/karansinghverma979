<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1017" />
      <stop offset="100%" stop-color="#08090C" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="495" height="195" rx="12" fill="url(#cardGrad)" stroke="#1F2430" stroke-width="1.5"/>
  <rect x="1" y="1" width="493" height="3" rx="1.5" fill="url(#cyanGrad)"/>

  <!-- Header Title -->
  <text x="25" y="38" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="16" font-weight="800" fill="#00F0FF" filter="url(#glow)">
    ⚡ KARAN'S GITHUB TELEMETRY
  </text>
  <circle cx="465" cy="33" r="5" fill="#10B981"/>

  <!-- Stat Items -->
  <!-- Total Repos -->
  <g transform="translate(25, 60)">
    <text x="0" y="15" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Public Repositories</text>
    <text x="220" y="15" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#F8FAFC">16 Active</text>
    <line x1="0" y1="24" x2="445" y2="24" stroke="#161922" stroke-width="1"/>
  </g>

  <!-- Stars Earned -->
  <g transform="translate(25, 92)">
    <text x="0" y="15" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Total Stars Earned</text>
    <text x="220" y="15" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#F59E0B">40 ★</text>
    <line x1="0" y1="24" x2="445" y2="24" stroke="#161922" stroke-width="1"/>
  </g>

  <!-- Shipped Releases -->
  <g transform="translate(25, 124)">
    <text x="0" y="15" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Shipped Releases</text>
    <text x="220" y="15" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#00F0FF">Apex v2.0 • Sakshi v1.0</text>
    <line x1="0" y1="24" x2="445" y2="24" stroke="#161922" stroke-width="1"/>
  </g>

  <!-- Architecture Standard -->
  <g transform="translate(25, 156)">
    <text x="0" y="15" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Architecture Standard</text>
    <text x="220" y="15" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#10B981">&lt;44ms Boot • 0MB RAM</text>
  </g>
</svg>
